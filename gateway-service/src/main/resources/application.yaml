spring:
  application:
    name: gateway-service
  cloud:
    config:
      import: optional:configserver:http://localhost:9999
      fail-fast: false
      retry:
        max-attempts: 3
        initial-interval: 1000
    gateway:
      server:
        webflux:
         globalcors:
           cors-configurations:
             '[/**]':
               allowedOrigins: "http://localhost:4200"
               allowedMethods: "*"
               allowedHeaders: "*"
               allowCredentials: 'true'
               maxAge: 3600
