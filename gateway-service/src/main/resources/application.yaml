spring:
  cloud:
    gateway:
      server:
        webflux:
         globalcors:
           cors-configurations:
             '[/**]':
               allowedOrigins: "*"
               allowedMethods: "*"
               allowedHeaders: "*"
               allowCredentials: 'true'
               maxAge: 3600
