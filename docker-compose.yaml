services:
  postgres-server:
    image: postgres:12.8-alpine
    container_name: postgres-server
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=tanguydev
    ports:
      - '5431:5432'
    expose:
      - '5431'


  ebank-discorvery-service:
    build: ./discovery-service
    ports:
      - '8761:8761'
    expose:
      - '8761'
    container_name: ebank-discorvery-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
#      start_period: 20s

  ebank-config-service:
    build: ./config-service
    ports:
      - '9999:9999'
    expose:
      - '9999'
    container_name: ebank-config-service
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:9999/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    #      start_period: 20s
    volumes:
      - ./config-repo:/home/tanguydev/Projects/Spring/MicroServices/e-bank-ms-app/config-repo
    environment:
      - DISCOVERY_SERVICE_URL=http://ebank-discorvery-service:8761/eureka
    depends_on:
      ebank-discorvery-service:
        condition: service_healthy


  ebank-customer-service:
    build: ./customer-service
    ports:
      - '8082:8082'
    expose:
      - '8082'
    container_name: ebank-customer-service
    volumes:
      - ./config-repo:/home/tanguydev/Projects/Spring/MicroServices/e-bank-ms-app/config-repo
    environment:
      - DISCOVERY_SERVICE_URL=http://ebank-discorvery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://ebank-config-service:9999
      - DB_HOST=postgres-server
      - DB_NAME=customers_db
    depends_on:
      ebank-config-service:
        condition: service_healthy
      postgres-server:
        condition: service_started


  ebank-account-service:
    build: ./ebank-service
    ports:
      - '8083:8083'
    expose:
      - '8083'
    container_name: ebank-account-service
    volumes:
      - ./config-repo:/home/tanguydev/Projects/Spring/MicroServices/e-bank-ms-app/config-repo
    environment:
      - DISCOVERY_SERVICE_URL=http://ebank-discorvery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://ebank-config-service:9999
      - DB_HOST=postgres-server
      - DB_NAME=ebank_db
    depends_on:
      ebank-config-service:
        condition: service_healthy
      postgres-server:
        condition: service_started


  ebank-gateway-service:
    build: ./gateway-service
    ports:
      - '8888:8888'
    expose:
      - '8888'
    container_name: ebank-gateway-service
    volumes:
      - ./config-repo:/home/tanguydev/Projects/Spring/MicroServices/e-bank-ms-app/config-repo
    environment:
      - DISCOVERY_SERVICE_URL=http://ebank-discorvery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://ebank-config-service:9999
    depends_on:
      ebank-config-service:
          condition: service_healthy

