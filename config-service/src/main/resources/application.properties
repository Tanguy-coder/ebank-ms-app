spring.application.name=config-service
server.port=9999
spring.cloud.config.server.git.uri=file:///home/tanguydev/Projects/Spring/MicroServices/e-bank-ms-app/config-repo
#spring.cloud.config.server.git.uri=https://gitlab.com/microservices6125502/ebank-config-propreties

# Configuration Eureka complète
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Actuator pour le monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
